<div class="bbp-card bbp-alert" data-duration="{{duration}}">
  <img class="bbp-bg" src="https://raw.githubusercontent.com/MasAjie12/bagibagi-purple-alert-assets/main/bg.png" alt="">
  <div class="bbp-overlay"></div>
  <div class="bbp-sparkles" aria-hidden="true"></div>
  <div class="bbp-content">
    <div class="bbp-title">HATUR NUHUN BOSKUH</div>
    <div class="bbp-amount">{{formattedAmount}}</div>
    <div class="bbp-from">Dari</div>
    <div class="bbp-sender-row"><span class="bbp-sender">{{senderName}}</span></div>
    <div class="bbp-message">{{message}}</div>
    <img class="bbp-gif" src="{{gif}}" alt="">
  </div>
  <div class="bbp-glow" aria-hidden="true"></div>
</div>
